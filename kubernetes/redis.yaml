---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpspend-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mcpspend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: mcpspend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: mcpspend
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcpspend-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mcpspend
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: mcpspend
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
