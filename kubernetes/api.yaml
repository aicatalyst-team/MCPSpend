---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpspend-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mcpspend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: mcpspend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: mcpspend
    spec:
      imagePullSecrets:
        - name: autopoc-registry-pull
      containers:
        - name: api
          image: quay.io/aicatalyst/mcpspend-api:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcpspend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mcpspend-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcpspend-secrets
                  key: JWT_SECRET
            - name: DASHBOARD_URL
              value: "http://mcpspend-dashboard:3000"
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcpspend-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mcpspend
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mcpspend
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
