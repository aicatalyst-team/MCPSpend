---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpspend-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: mcpspend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      app.kubernetes.io/part-of: mcpspend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: mcpspend
    spec:
      imagePullSecrets:
        - name: autopoc-registry-pull
      containers:
        - name: dashboard
          image: quay.io/aicatalyst/mcpspend-dashboard:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://mcpspend-api:4000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcpspend-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: mcpspend
spec:
  selector:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: mcpspend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
