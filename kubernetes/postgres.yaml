---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcpspend-postgres-pvc
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcpspend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpspend-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcpspend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: mcpspend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: mcpspend
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              value: mcpspend
            - name: POSTGRESQL_PASSWORD
              value: mcpspend123
            - name: POSTGRESQL_DATABASE
              value: mcpspend
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U mcpspend -d mcpspend
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U mcpspend -d mcpspend
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: mcpspend-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mcpspend-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcpspend
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: mcpspend
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
